services:
  - type: web
    name: tailor-cost-prediction
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn tailor_project.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: tailor_project.settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"